name: Build OpenNOW Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-native

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept SDK Licenses & Install NDK / CMake 3.22.1
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"
          # Hapus cmake 4.x agar tidak terpilih
          rm -rf $ANDROID_HOME/cmake/4* || true
          # Tambahkan CMake 3.22.1 ke PATH sistem secara resmi di GitHub Actions
          echo "$ANDROID_HOME/cmake/3.22.1/bin" >> $GITHUB_PATH

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.0.12077973
          CMAKE: /usr/local/lib/android/sdk/cmake/3.22.1/bin/cmake
        run: |
          cd android
          ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenNOW-Android-16Buttons
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
